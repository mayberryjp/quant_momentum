# docker-compose for quant_momentum.
#
# Connects to the shared `quant` stack (Postgres, quant_signals, optional Redis)
# via an external Docker network. Adjust the network name below to match your
# environment (the network is finalized in slice 7).
services:
  quant_momentum:
    build:
      context: .
      args:
        CACHE_BUST: "1"
    image: quant_momentum:latest
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://quant:quant_dev_password@postgres:5432/quant}
      QUANT_SIGNALS_BASE_URL: ${QUANT_SIGNALS_BASE_URL:-http://quant_signals:8016}
      QUANT_REDIS_URL: ${QUANT_REDIS_URL:-}
      API_PORT: "8020"
      API_LISTEN_ADDRESS: "0.0.0.0"
      MOMENTUM_INTERVAL: "${MOMENTUM_INTERVAL:-86400}"
    ports:
      - "8020:8020"
    restart: unless-stopped
    networks:
      - quant

networks:
  quant:
    external: true
    name: quant_default
