services:
  quant_momentum:
    image: mayberry4477/quant_momentum:latest
    environment:
      # -- Database ----------------------------------------------------------
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://quant:quant_dev_password@postgres:5432/quant}

      # -- Read API ----------------------------------------------------------
      API_PORT: "${API_PORT:-8020}"
      API_LISTEN_ADDRESS: ${API_LISTEN_ADDRESS:-0.0.0.0}

      # -- Momentum compute --------------------------------------------------
      MOMENTUM_INTERVAL: "${MOMENTUM_INTERVAL:-86400}"
      # Deterministic daily run time; when set it takes precedence over MOMENTUM_INTERVAL.
      MOMENTUM_RUN_AT: "${MOMENTUM_RUN_AT:-21:30}"
      MOMENTUM_TIMEZONE: ${MOMENTUM_TIMEZONE:-America/New_York}
      MOMENTUM_ADJUSTMENT_TYPE: ${MOMENTUM_ADJUSTMENT_TYPE:-unadjusted}
      MOMENTUM_LOOKBACKS: ${MOMENTUM_LOOKBACKS:-5,15,30}
      MOMENTUM_THRESHOLD_5D: "${MOMENTUM_THRESHOLD_5D:-0.0}"
      MOMENTUM_THRESHOLD_15D: "${MOMENTUM_THRESHOLD_15D:-0.0}"
      MOMENTUM_THRESHOLD_30D: "${MOMENTUM_THRESHOLD_30D:-0.0}"
      MOMENTUM_RULE: ${MOMENTUM_RULE:-ALL}
      MOMENTUM_MIN_HISTORY: "${MOMENTUM_MIN_HISTORY:-31}"
      MOMENTUM_DIRECTION_MODE: ${MOMENTUM_DIRECTION_MODE:-long_only}

      # -- Watchlist submission ---------------------------------------------
      MOMENTUM_SUBMIT_ENABLED: "${MOMENTUM_SUBMIT_ENABLED:-true}"
      MOMENTUM_SOURCE: ${MOMENTUM_SOURCE:-momentum-v1}
      MOMENTUM_HORIZON: ${MOMENTUM_HORIZON:-30d}
      MOMENTUM_SCORE_SCALE: "${MOMENTUM_SCORE_SCALE:-30.0}"

      # -- quant_signals client ---------------------------------------------
      QUANT_SIGNALS_BASE_URL: ${QUANT_SIGNALS_BASE_URL:-http://quant_signals:8016}
      QUANT_SIGNALS_TIMEOUT_SECONDS: "${QUANT_SIGNALS_TIMEOUT_SECONDS:-10}"
      QUANT_SIGNALS_RETRY_COUNT: "${QUANT_SIGNALS_RETRY_COUNT:-3}"
      QUANT_SIGNALS_BACKOFF_SECONDS: "${QUANT_SIGNALS_BACKOFF_SECONDS:-0.5}"

      # Set QUANT_REDIS_URL to enable the optional cross-instance run lock.
      QUANT_REDIS_URL: ${QUANT_REDIS_URL:-}
    ports:
      - "${API_PORT:-8020}:${API_PORT:-8020}"
    restart: unless-stopped
