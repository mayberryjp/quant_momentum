[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-momentum"
version = "0.1.0"
description = "Daily 5/15/30-day close-to-close momentum computation service for the quant pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "bottle>=0.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    "requests>=2.31",
    "SQLAlchemy>=2.0",
    "waitress>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "webtest>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
